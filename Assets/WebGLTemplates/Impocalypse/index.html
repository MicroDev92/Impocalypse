<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>{{{ PRODUCT_NAME }}}</title>
    <style>
      /* Unity's stock Minimal template hardcodes the canvas to WIDTH x HEIGHT in
         pixels, so going fullscreen left the game at 960x600 with black around it.
         Filling the viewport instead lets the embed AND fullscreen both work -
         the game's own CanvasScaler handles whatever aspect ratio it is given. */
      html, body {
        width: 100%; height: 100%;
        padding: 0; border: 0; margin: 0;
        overflow: hidden;
        background: #140C0A;
      }
      #unity-canvas {
        display: block;
        width: 100%; height: 100%;
        background: #140C0A;
      }
      /* Portrait on a touch device is unusable: two 380-unit sidebars take 78% of
         the canvas width. iOS will not honour an orientation lock from a web page,
         so the only honest option is to ask. Pure CSS, so it is up before Unity has
         even finished loading. */
      #rotate-hint {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 10;
        background: #140C0A;
        color: #F0A868;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 28px;
        padding: 24px;
        text-align: center;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      #rotate-hint .phone {
        width: 54px;
        height: 92px;
        border: 4px solid #E0712A;
        border-radius: 10px;
      }
      #rotate-hint p {
        margin: 0;
        font-size: 19px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }
      #rotate-hint small {
        display: block;
        margin-top: 10px;
        font-size: 13px;
        letter-spacing: 0.04em;
        color: #8A6652;
        text-transform: none;
      }
      /* Visibility is decided in script, not here. The CSS orientation feature
         describes the IFRAME's box, and itch serves the game in a fixed-size one,
         so it stays "portrait" however the phone is held - the hint went up and
         never came down. Defaulting to hidden also means a script failure costs a
         missing hint rather than a locked screen. */
      #rotate-hint.visible { display: flex; }
      #rotate-hint button {
        appearance: none;
        background: transparent;
        border: 2px solid #8A6652;
        border-radius: 8px;
        color: #C79070;
        font: inherit;
        font-size: 14px;
        letter-spacing: 0.08em;
        padding: 10px 22px;
        text-transform: uppercase;
      }
      @media (prefers-reduced-motion: no-preference) {
        #rotate-hint .phone { animation: tipover 2.4s ease-in-out infinite; }
      }
      @keyframes tipover {
        0%, 30%  { transform: rotate(0deg); }
        55%, 85% { transform: rotate(-90deg); }
        100%     { transform: rotate(0deg); }
      }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" width={{{ WIDTH }}} height={{{ HEIGHT }}} tabindex="-1"></canvas>
    <div id="rotate-hint" aria-live="polite">
      <div class="phone"></div>
      <p>Rotate your device<small>Impocalypse plays in landscape</small></p>
      <button id="rotate-dismiss" type="button">Play anyway</button>
    </div>
    <script>
      // Decide the rotate hint from the DEVICE, not from the CSS orientation
      // media feature: inside itch's fixed-size iframe that feature never changes
      // when the phone turns, which left the hint up permanently with no way past.
      (function () {
        var hint = document.getElementById("rotate-hint");
        var dismissed = false;

        // screen.orientation and window.orientation report the device even from
        // inside an iframe. Returns null when neither is available.
        function devicePortrait() {
          var so = window.screen && window.screen.orientation;
          if (so && typeof so.type === "string") return so.type.indexOf("portrait") === 0;
          if (typeof window.orientation === "number") {
            return window.orientation === 0 || window.orientation === 180;
          }
          return null;
        }

        function update() {
          if (dismissed) { hint.classList.remove("visible"); return; }

          var coarse = !window.matchMedia || window.matchMedia("(pointer: coarse)").matches;
          var viewportPortrait = window.innerHeight > window.innerWidth;
          var device = devicePortrait();

          // Require BOTH the device and the frame to look portrait. Hiding on a
          // wrong guess costs a cramped layout; showing on a wrong guess strands
          // the player, so the asymmetry decides which way to err.
          var show = coarse && viewportPortrait && (device === null ? true : device);
          hint.classList.toggle("visible", show);
        }

        function recheck() {
          // iOS reports stale dimensions for a moment after a rotation, so sample
          // again as it settles rather than trusting the first value.
          update();
          setTimeout(update, 120);
          setTimeout(update, 400);
          setTimeout(update, 900);
        }

        hint.addEventListener("click", function () { dismissed = true; update(); });

        window.addEventListener("resize", update);
        window.addEventListener("orientationchange", recheck);
        if (window.screen && window.screen.orientation && window.screen.orientation.addEventListener) {
          window.screen.orientation.addEventListener("change", recheck);
        }
        if (window.visualViewport) window.visualViewport.addEventListener("resize", update);

        update();
      })();
    </script>
    <script src="Build/{{{ LOADER_FILENAME }}}"></script>
    <script>
      // Right-drag pans the board, so stop the browser hijacking it with a
      // context menu over the canvas.
      document.querySelector("#unity-canvas").addEventListener("contextmenu", e => e.preventDefault());

      createUnityInstance(document.querySelector("#unity-canvas"), {
        arguments: [],
        dataUrl: "Build/{{{ DATA_FILENAME }}}",
        frameworkUrl: "Build/{{{ FRAMEWORK_FILENAME }}}",
#if USE_THREADS
        workerUrl: "Build/{{{ WORKER_FILENAME }}}",
#endif
#if USE_WASM
        codeUrl: "Build/{{{ CODE_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
        symbolsUrl: "Build/{{{ SYMBOLS_FILENAME }}}",
#endif
        streamingAssetsUrl: "StreamingAssets",
        companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
        productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
        productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
      }).catch((message) => {
        alert(message);
      });
    </script>
  </body>
</html>
