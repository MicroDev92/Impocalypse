<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>{{{ PRODUCT_NAME }}}</title>
    <style>
      /* Unity's stock Minimal template hardcodes the canvas to WIDTH x HEIGHT in
         pixels, so going fullscreen left the game at 960x600 with black around it.
         Filling the viewport instead lets the embed AND fullscreen both work -
         the game's own CanvasScaler handles whatever aspect ratio it is given. */
      html, body {
        width: 100%; height: 100%;
        padding: 0; border: 0; margin: 0;
        overflow: hidden;
        background: #140C0A;
      }
      #unity-canvas {
        display: block;
        width: 100%; height: 100%;
        background: #140C0A;
      }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" width={{{ WIDTH }}} height={{{ HEIGHT }}} tabindex="-1"></canvas>
    <script src="Build/{{{ LOADER_FILENAME }}}"></script>
    <script>
      // Right-drag pans the board, so stop the browser hijacking it with a
      // context menu over the canvas.
      document.querySelector("#unity-canvas").addEventListener("contextmenu", e => e.preventDefault());

      createUnityInstance(document.querySelector("#unity-canvas"), {
        arguments: [],
        dataUrl: "Build/{{{ DATA_FILENAME }}}",
        frameworkUrl: "Build/{{{ FRAMEWORK_FILENAME }}}",
#if USE_THREADS
        workerUrl: "Build/{{{ WORKER_FILENAME }}}",
#endif
#if USE_WASM
        codeUrl: "Build/{{{ CODE_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
        symbolsUrl: "Build/{{{ SYMBOLS_FILENAME }}}",
#endif
        streamingAssetsUrl: "StreamingAssets",
        companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
        productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
        productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
      }).catch((message) => {
        alert(message);
      });
    </script>
  </body>
</html>
